name : Accompanion System Compatibility test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  windows_testing:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # conda-forge has no FluidSynth for Windows, and the ACCompanion only
      # uses it on Linux and macOS (see accompanion/midi_handler/fluid.py).
      - name: Drop FluidSynth from the conda environment
        run: sed '/^  - fluidsynth/d' environment.yml > environment-windows.yml

      - name: Install Conda dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: accompanion
          environment-file: environment-windows.yml
          auto-activate-base: false

      - name: Install Accompanion
        run: |
          conda list
          pip install -e .

      - name: Run Accompanion
        run: |
          cd bin
          python launch_acc.py --test

  ubuntu_testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install System Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libjack-dev libasound2-dev fluidsynth alsa-tools

      - name: Install Conda dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: accompanion
          environment-file: environment.yml
          auto-activate-base: false

      - name: Install Accompanion
        run: |
          conda list
          pip install pyfluidsynth
          pip install -e .

      - name: Run Accompanion
        run: |
          cd bin
          python launch_acc.py --test

  macOS_testing:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install System Requirements
        run:
          brew install fluidsynth

      - name: Install Conda dependencies
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: accompanion
          environment-file: environment.yml
          auto-activate-base: false

      - name: Install Accompanion
        run: |
          conda list
          pip install pyfluidsynth
          pip install -e .

      - name: Run Accompanion
        run: |
          cd bin
          python launch_acc.py --test
