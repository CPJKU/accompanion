# Conda environment for the ACCompanion.
#
# This file provides the interpreter and the packages that are better installed
# by conda than by pip: the ones with a compiled or system component, and the
# ones whose version has to be held back. Every other Python dependency is
# declared in setup.py and installed by `pip install -e .`
#
#   conda env create -f environment.yml
#   conda activate accompanion
#   pip install -e .
name: accompanion

channels:
  - conda-forge

dependencies:
  # matchmaker, which provides the score followers, supports 3.10 - 3.12.
  - python=3.11
  - pip

  # basismixer imports pkg_resources, which setuptools removed in 81.
  - setuptools<81

  # matchmaker needs numpy 1.x. basismixer calls scipy.misc.derivative, which
  # SciPy removed in 1.15.
  - numpy=1.26.*
  - scipy>=1.11.4,<1.15

  # Only needed because basismixer.utils.music imports it. Installed here as
  # the CPU build so that pip does not pull the much larger CUDA wheels.
  - pytorch-cpu

  # The synthesiser the ACCompanion plays through, and the library pyfluidsynth
  # binds to.
  - fluidsynth
